name: Publicar APK

# Al mergear una PR a dev (release candidate) o la PR dev -> main (estable),
# publica el APK que ya compiló apk-pr.yml para la cabeza de esa PR: no recompila.
# Antes de publicar verifica que ese APK corresponda exactamente a lo mergeado.
#
# La versión no se commitea: queda en un tag anotado "versionCode=N" sobre el
# merge commit (de ahí la lee apk-pr.yml). Así no hay pushes a dev/main que
# necesiten saltear el check obligatorio del ruleset.

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  # Para descargar el artifact del run de apk-pr.yml.
  actions: read

jobs:
  publicar:
    name: Publicar APK
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest

    outputs:
      destino: ${{ steps.verificar.outputs.destino }}
      version: ${{ steps.verificar.outputs.version }}
      versionCode: ${{ steps.verificar.outputs.versionCode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Buscar el APK compilado en la PR
        id: compilacion
        uses: actions/github-script@v9
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            // Se filtra por ruta y no con workflow_id: eso exige que el archivo ya esté en main.
            const runs = (await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, head_sha: headSha, status: 'success', per_page: 100,
            })).filter(r => r.path === '.github/workflows/apk-pr.yml');
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const run of runs) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
              const art = data.artifacts.find(a => a.name === 'apk-pr' && !a.expired);
              if (art) {
                core.info(`APK encontrado en el run ${run.html_url}`);
                core.setOutput('run_id', run.id);
                return;
              }
            }
            core.setFailed(
              `No hay un APK compilado (o venció) para ${headSha}. ` +
              `Re-ejecutá "APK de la PR" en Actions con este número de PR y después re-ejecutá esta publicación.`);

      - name: Descargar APK
        uses: actions/download-artifact@v8
        with:
          name: apk-pr
          path: apk-pr
          run-id: ${{ steps.compilacion.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verificar que el APK corresponde a lo mergeado
        id: verificar
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          meta="apk-pr/compilacion.json"
          cat "$meta"
          campo() { jq -r ".$1" "$meta"; }

          tipo=bugfix
          if jq -e 'map(ascii_downcase) | index("breaking")' <<<"$LABELS" >/dev/null; then tipo=breaking
          elif jq -e 'map(ascii_downcase) | index("feature")' <<<"$LABELS" >/dev/null; then tipo=feature
          fi

          [ "$(campo head_sha)" = "$HEAD_SHA" ] || { echo "❌ El APK es de otro commit de la PR"; exit 1; }
          [ "$(campo base_ref)" = "$BASE_REF" ] || { echo "❌ El APK se compiló para otra rama destino"; exit 1; }
          [ "$(campo tipo)" = "$tipo" ] || { echo "❌ Las etiquetas de la PR cambiaron después de compilar ($(campo tipo) -> $tipo)"; exit 1; }
          # La rama destino justo antes del merge tiene que ser la misma contra la que se compiló.
          base_previa=$(git rev-parse "$MERGE_SHA^1")
          [ "$(campo base_sha)" = "$base_previa" ] || {
            echo "❌ $BASE_REF cambió entre la compilación ($(campo base_sha)) y el merge ($base_previa)"; exit 1; }

          version=$(campo version)
          versionCode=$(campo versionCode)
          apk="apk-pr/com.escorial.trazabilidad-$version-$versionCode.apk"
          [ -f "$apk" ] || { echo "❌ Falta $apk en el artifact"; exit 1; }
          git rev-parse -q --verify "refs/tags/$version" >/dev/null && { echo "❌ El tag $version ya existe"; exit 1; }
          # Y que siga siendo la versión que toca después de la última publicada.
          actual=$(bash .github/scripts/version-actual.sh app/build.gradle.kts)
          esperada=$(bash .github/scripts/calcular-version.sh "$BASE_REF" "$tipo" \
            "$(sed -n 's/^versionName=//p' <<<"$actual")" "$(sed -n 's/^versionCode=//p' <<<"$actual")")
          [ "$esperada" = "version=$version"$'\n'"versionCode=$versionCode" ] || {
            echo "❌ El APK es $version ($versionCode) pero ahora corresponde: $esperada"; exit 1; }

          {
            echo "destino=$BASE_REF"
            echo "version=$version"
            echo "versionCode=$versionCode"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Se publica $version ($versionCode) en $BASE_REF"

      - name: Crear tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERSION: ${{ steps.verificar.outputs.version }}
          VERSION_CODE: ${{ steps.verificar.outputs.versionCode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Anotado: el mensaje "versionCode=N" es lo que lee version-actual.sh.
          git tag -a "$VERSION" -m "versionCode=$VERSION_CODE" "$MERGE_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.verificar.outputs.version }}
          name: Trazabilidad${{ steps.verificar.outputs.destino == 'dev' && ' (pre-release)' || '' }} - ${{ steps.verificar.outputs.version }}
          body: ${{ steps.verificar.outputs.version }}
          files: ${{ steps.verificar.outputs.apk }}
          prerelease: ${{ steps.verificar.outputs.destino == 'dev' }}

      - name: Dejar el APK para F-Droid
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.verificar.outputs.apk }}
          retention-days: 1
          if-no-files-found: error

  fdroid-publish:
    needs: publicar
    uses: ./.github/workflows/fdroid-publish.yml
    with:
      # Solo el release estable (main) fija la versión recomendada.
      current_version_code: ${{ needs.publicar.outputs.destino == 'main' && needs.publicar.outputs.versionCode || '' }}
      current_version: ${{ needs.publicar.outputs.destino == 'main' && needs.publicar.outputs.version || '' }}
    secrets: inherit
